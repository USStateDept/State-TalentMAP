<!DOCTYPE html>
<html lang='en'>

<head>
  <title>TalentMAP Persona Selection</title>
  <style>
    a {
      font-size: 1.5em;
      line-height: 3em;
      cursor: pointer;
      text-decoration: underline;
      color: blue
    }

    input[type="text"],
    input[type="textarea"] {
      width: 700px;
      /* Adjust the width as needed */
    }

    .red-button {
      background-color: red !important;
      color: white !important;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
    }

    .red-button:hover {
      background-color: darkred !important;
      /* Optional: Add a hover effect */
    }

    body {
      padding-left: 1.5em;
    }
  </style>
</head>

<body>
  <div id='main' style='display:none'>
    <h1>Developer Login</h1>
    <div>
      <form onsubmit='login(); return false;'>
        <label for='auth_data'>Paste the login json from Dev1 Dashboard/Profile/Settings:</label>
        <input type='text' name='auth_data' id='auth_data' />
        <label for='api_url'>ApiUrl:</label>
        <input type='text' name='api_url' id='api_url' />
        <button type='submit'>Submit</button>
      </form>
    </div>
    </hr>
    <div>
      <h2>Session and Local Storage</h2>
      <p>Note: The values in the input fields are not editable. They are populated from your browser's session and local
        storage.</p>
      <table>
        <tr>
          <td>Username</td>
          <td><input type='text' name='username' id='username' disabled /></td>
        </tr>
        <tr>
          <td>Grantor</td>
          <td><input type='text' name='grantor' id='grantor' disabled /></td>
        </tr>
        <tr>
          <td>sessionStorage.apiurl</td>
          <td><input type='text' name='apiUrl' id='apiUrl' disabled /></td>
        </tr>
        <tr>
          <td>sessionStorage.jwt</td>
          <td><input type='text' name='jwt' id='jwt' disabled /></td>
        </tr>
        <tr>
          <td>localStorage.token</td>
          <td><input type='text' name='token' id='token' disabled /></td>
        </tr>
      </table>
      <button id='reloginBtn' onclick='relogin()' style="display: none;">Re-Login</button>
      <button id='clearStorageBtn' onclick='clearStorage()' class='red-button'>Clear browswer Storage</button>
    </div>
  </div>

  <script>
    window.onload = function () {
      // If the URL does not contain ':3000', redirect to the base URL
      if (!window.location.host.includes(':3000')) {
        window.location.href = window.location.href.replace('login.html', '');
        return;
      }

      // Show the main content of the page
      document.getElementById('main').style.display = 'block';

      // If the session storage and local storage have values, show the relogin button
      if (sessionStorage.getItem('jwt') && localStorage.getItem('token')) {
        document.getElementById('reloginBtn').style.display = 'block';
      }

      // Set the Login to false in localStorage
      localStorage.setItem('doLogin', 'false');

      // Get the current URL and set it as the value of the input field for the API URL
      document.getElementById('api_url').value = window.location.href.split(':3000')[0] + ':8000/api/v1';
      document.getElementById('jwt').value = sessionStorage.getItem('jwt') || '';
      document.getElementById('apiUrl').value = sessionStorage.getItem('apiUrl') || '';
      document.getElementById('token').value = formatToken(localStorage.getItem('token')) || '';
      const dJwt = JSON.parse(localStorage.getItem('decodedJwt'));
      if (dJwt) {
        document.getElementById('username').value = dJwt.unique_name.split('\\')[1] || '';
        document.getElementById('grantor').value = dJwt.aud || '';
      }
    };


    // Function to clear session storage and local storage
    function clearStorage() {
      // Clear the session storage and local storage
      sessionStorage.clear();
      localStorage.clear();
      console.log('Storage cleared!!');
      // Reload the page to reflect the changes
      window.location.reload();
    }

    // Function formatToken
    function formatToken(token) {
      // Check if the token is null or undefined
      if (!token) {
        return ''; // Return an empty string if the token is null or undefined
      }
      // Format the token by removing leading and trailing whitespace and replacing newlines with spaces
      return token.trim().replace(/^Token\s+/, '').replace(/"/g, '').replace(/'/g, '')
    }

    // Function to decode the JWT
    function base64UrlDecode(jwt) {
      // Get the characters after the first dot (the payload)
      jwt = jwt.split('.')[1]; // Get the payload part of the JWT

      // Replace URL-safe characters with base64 characters
      jwt = jwt.replace(/-/g, '+').replace(/_/g, '/');

      // Loop to add padding if necessary
      while (jwt.length % 4) {
        jwt += '=';
      }
      return decodeURIComponent(escape(atob(jwt)));
    }

    function relogin() {
      // Set the localStorage to allow index.jsx to login
      localStorage.setItem('doLogin', 'true');
      // Redirect to the login page
      window.location.href = '/tokenValidation?tmApiToken=' + formatToken(localStorage.getItem('token'));
    }
    // Function to handle login login
    async function login() {
      // Clear the session storage and local storage
      clearStorage();

      // The the token data from the input field
      const tokenData = JSON.parse(document.getElementById('auth_data').value);

      // Store the jwt in sesstionStorage
      sessionStorage.setItem('jwt', tokenData.jwt);
      localStorage.setItem('token', formatToken(tokenData.token));
      sessionStorage.setItem('apiUrl', document.getElementById('api_url').value);
      localStorage.setItem('doLogin', 'true');

      // Store the decrpyted jwt in localStorage
      localStorage.setItem('decodedJwt', base64UrlDecode(tokenData.jwt));

      // Redirect to the token validation page with the token
      window.location.href = '/tokenValidation?tmApiToken=' + formatToken(tokenData.token);

    }
  </script>
</body>

</html>
