<!DOCTYPE html>
<html lang='en'>

<head>
  <title>TalentMAP Persona Selection</title>
  <style>
    a {
      font-size: 1.5em;
      line-height: 3em;
      cursor: pointer;
      text-decoration: underline;
      color: blue
    }

    body {
      padding-left: 1.5em;
    }
  </style>
</head>

<body>
  <div>
    <h1>Developer Login</h1>
    <div>
      <form onsubmit='localhostLogin(); return false;'>
        <label for='auth_data'>Paste the login json from Dev1 Dashboard/Profile/Settings:</label>
        <input type='text' name='auth_data' id='auth_data' />
        <label for='api_url'>ApiUrl:</label>
        <input type='text' name='api_url' id='api_url' />
        <button type='submit'>Submit</button>
      </form>
      <button id='currentUrlButton' onclick='clearStorage()'>Clear browswer Storage</button>
    </div>
  </div>

  <script>
    window.onload = function () {
      if (!window.location.href.includes(':3000')) {
        return;
      }

      const jwt = sessionStorage.getItem('jwt');
      const token = localStorage.getItem('token');

      if (jwt && token) {
        console.log('User is already logged in.');
        // Redirect to the token validation page with the token
        window.location.href = '/tokenValidation?tmApiToken=' + token;
      } else {
        sessionStorage.setItem('doLogin', 'false');
        console.log('User is not logged in...');
      }
      // Get the current URL and set it as the value of the input field for the API URL
      document.getElementById('api_url').value = window.location.href.split(':3000')[0] + ':8000/api/v1';
    };


    // Function to clear session storage and local storage
    function clearStorage() {
      // Clear the session storage and local storage
      sessionStorage.clear();
      localStorage.clear();
      console.log('Storage cleared!!');
    }
    // Function to handle login
    async function login(username, password) {
      try {

        // Get the API URL from session storage. This is set in the src/index.jsx file
        const apiUrl = sessionStorage.getItem('apiUrl');

        // Make a POST request to the token endpoint
        const tokenResponse = await fetch(`${apiUrl}/accounts/token/`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          // Send the username and password in the request body
          body: new URLSearchParams({
            username: username,
            password: password
          })
        });

        // Check if the response is ok and parse the JSON
        if (tokenResponse.ok) {
          // Parse the JSON response
          const data = await tokenResponse.json();

          // Store the username in localStorage, use local storage to persist the username
          localStorage.setItem('tmusrname', username);

          // Redirect to the token validation page with the token
          window.location.href = '/tokenValidation?tmApiToken=' + data.token;
        } else {
          throw new Error('Token request failed...');
        }
      } catch (error) {
        console.error('Error during login:', error);
      }
    }

    // Function to handle form submission
    function submitLogin() {
      login(document.getElementById('username').value, document.getElementById('password').value);
    }


    function base64UrlDecode(jwt) {
      // Get the characters after the first dot (the payload)
      jwt = jwt.split('.')[1]; // Get the payload part of the JWT

      // Replace URL-safe characters with base64 characters
      jwt = jwt.replace(/-/g, '+').replace(/_/g, '/');

      // Loop to add padding if necessary
      while (jwt.length % 4) {
        jwt += '=';
      }
      return decodeURIComponent(escape(atob(jwt)));
    }

    // Function to handle localhost login
    async function localhostLogin() {
      // The the token data from the input field
      const tokenData = JSON.parse(document.getElementById('auth_data').value);

      // Store the jwt in sesstionStorage
      sessionStorage.setItem('jwt', tokenData.jwt);
      sessionStorage.setItem('apiUrl', document.getElementById('api_url').value);
      sessionStorage.setItem('doLogin', 'true');

      // Store the decrpyted jwt in localStorage
      localStorage.setItem('decodedJwt', base64UrlDecode(tokenData.jwt));

      // Redirect to the token validation page with the token
      window.location.href = '/tokenValidation?tmApiToken=' + tokenData.token.replace(/^Token\s+/, '').replace(/"/g, '').replace(/'/g, '');

    }
  </script>
</body>

</html>
