<!DOCTYPE html>
<html lang="en">
<head>
  <title>TalentMAP Persona Selection</title>
  <style>
    a { font-size:1.5em; line-height: 3em; cursor: pointer; text-decoration: underline; color: blue }
    body { padding-left: 1.5em; }
  </style>
</head>
<body>
<div>
  <h1>Login</h1>
  <h2>Personas</h2>
  <ul>
    <li>
      <a OnClick="login('admin', 'admin');">Administrator</a>
    </li>
    <li>
      <a OnClick="login('shadtrachl', 'password');">Leah Shadtrach (CDO)</a>
    </li>
    <li>
      <a OnClick="login('townpostj', 'password');">Jenny Townpost (Bidder)</a>
    </li>
    <li>
      <a OnClick="login('rehmant', 'password');">Tarek Rehman (Bidder)</a>
    </li>
    <li>
      <a OnClick="login('woodwardw', 'password');">Wendy Woodward (Bureau)</a>
    </li>
    <li>
      <a OnClick="login('velezp', 'password');">Preston Velez (Post)</a>
    </li>
    <li>
      <a OnClick="login('lincolna', 'password');">Abigail Lincoln (GTM/AO)</a>
    </li>
    <li>
      <a OnClick="login('anthonyp', 'password');">Patrick Anthony (Panel Admin)</a>
    </li>
    <li>
      <a OnClick="login('andersons', 'password');">Stephanie Anderson (System Admin)</a>
    </li>
  </ul>
</div>
<div>
  <h2>Custom</h2>
  <form onsubmit="submitLogin(); return false;">
    <label for="username">Username</label>
    <input type="text" name="username" id="username" />
    <label for="password">Password</label>
    <input type="password" name="password" id="password" />
    <button type="submit">Submit</button>
  </form>
</div>
<script>
  const configPath = '/config/config.json';
 
  // Function to handle login
  async function login(username, password) {
    console.log('Logging in as:', username);

    // Fetch the config
    try {
      // Fetch the config file
      console.log('Fetching config from...');
      const response = await fetch(configPath);
      config = await response.json();

      // Make a POST request to the token endpoint
      const tokenResponse = await fetch(config.api_config.baseURL + "/accounts/token/", {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        // Send the username and password in the request body
        body: new URLSearchParams({
          username: username,
          password: password
        })
      });

      // Check if the response is ok and parse the JSON
      if (tokenResponse.ok) {
        // Parse the JSON response
        const data = await tokenResponse.json();

        // Store the username in localStorage, use local storage to persist the username
        localStorage.setItem("tmusrname", username);

        // Redirect to the token validation page with the token
        window.location.href = '/tokenValidation?tmApiToken=' + data.token;
      } else {
        console.error('Login failed:', tokenResponse.statusText);
      }
    } catch (error) {
      console.error('Error during login:', error);
    }
  }

  function submitLogin() {
    console.log('Logging in as:', document.getElementById('username').value);
    login(document.getElementById('username').value, document.getElementById('password').value);
  }
</script>
</body>
</html>
